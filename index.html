<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casino Key Derivation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@near-wallet-selector/modal-ui-js@8.10.2/styles.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <div class="brand">
    <h1><span id="title-text">Casino Key Derivation</span> <small id="contract-id"></small></h1>
  </div>
  <div class="row" id="wallet">
    <span id="account"></span>
    <span id="balance" class="hint" title="Balance at page load; refresh to update"></span>
    <button class="btn ghost" id="connect">Connect wallet</button>
  </div>
</header>

<main id="lobby">
  <section class="hero">
    <h2>Choose your game</h2>
    <p>Every round is drawn from the MPC network's derived key.</p>
    <div class="metas" id="house"></div>
  </section>
  <div class="game-grid" id="game-grid"><div class="empty">Loading games…</div></div>
</main>
<div class="toast" id="toast"></div>

<script src="js/common.js"></script>
<script src="js/lobby.js"></script>
<script src="js/sha256-shim.js"></script>
<script type="module" src="js/wallet.js"></script>
</body>
</html>
